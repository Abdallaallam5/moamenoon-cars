<!doctype html>

      <div class="nav-actions">
        <button class="lang" id="langBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>

          <span data-i18n="nav_wa"></span>
        </a>
        <div class="nav-auth" id="navAuth"></div>
      </div>
    </div>

  <main>
    <div class="wrap">
      <div class="page-head">
        <h1 id="pageTitle" data-i18n="cars_title"></h1>
        <p data-i18n="cars_sub"></p>
      </div>

      <div id="filterArea">
        <div class="f-cats" id="cats" role="group"></div>
        <form class="filters" id="filters" role="search">
          <div class="f"><label for="q" data-i18n="f_search_ph"></label><input id="q" type="search" data-i18n-ph="f_search_ph" autocomplete="off"></div>
          <div class="f"><label for="brand" data-i18n="f_brand"></label><select id="brand"></select></div>
          <div class="f"><label for="cond" data-i18n="f_cond"></label><select id="cond"></select></div>
          <div class="f"><label for="sort" data-i18n="f_sort"></label><select id="sort"></select></div>
        </form>
      </div>

      <div class="results-bar"><span id="count" aria-live="polite"></span><button class="pill" id="favOnly" type="button" hidden data-i18n="fav_only"></button></div>
      <div class="car-grid" id="grid"></div>
      <div class="empty" id="empty" hidden>
        <h3 data-i18n="empty_title"></h3>
        <p data-i18n="empty_text"></p>
        <a class="btn" href="index.html#cats"><span data-i18n="empty_cta"></span></a>
      </div>
      <div class="more"><button class="btn ghost" id="more" type="button" hidden data-i18n="load_more"></button></div>

          <a href="cars.html" data-i18n="nav_cars"></a>

        <span class="kicker" data-i18n="foot_call"></span>
        <a class="phone" id="footTel" href="#" dir="ltr"></a>
        <a class="btn" id="footWa" href="#" target="_blank" rel="noopener"><span data-i18n="foot_wa"></span></a>

  </a>
