<body id="top">

  <!-- NAV -->

      </a>
      <div class="nav-actions">
        <button class="lang" id="langBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>

  <main>
    <!-- HERO -->
    <section class="hero" id="hero">
      <div class="hero-media" aria-hidden="true">
        <img src="img/hero.jpg" alt="" fetchpriority="high">
      </div>
      <div class="hero-shade" aria-hidden="true"></div>
      <div class="streaks" aria-hidden="true"><i></i><i></i><i></i></div>

      <div class="hero-inner">
        <div class="hero-content">
          <span class="badge rise" style="--d:.15s"><i class="dot"></i><span data-i18n="badge">ثقة عملائنا هي تاريخنا</span></span>
          <h1 class="rise" style="--d:.3s" data-i18n-html="hero_title">تاريخٌ صنعته <em>ثقة</em> عملائنا</h1>
          <p class="lead rise" style="--d:.45s" data-i18n="hero_text"></p>
          <ul class="trust rise" style="--d:.6s">
            <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i18n="trust1"></span></li>
            <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i18n="trust2"></span></li>
            <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i18n="trust3"></span></li>
          </ul>
        </div>
      </div>

      <!-- CATEGORIES -->
      <div class="cats-wrap" id="cats">
        <div class="cats-head rise" style="--d:.7s">
          <span class="kicker" data-i18n="cats_kicker"></span>
          <h2 data-i18n="cats_title"></h2>
        </div>
        <div class="cats">
          <button class="cat" type="button" data-cat="import" style="--i:0">
            <span class="ico" aria-hidden="true">
              <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <path pathLength="1" d="M12 44H8Q6 44 6 42V36Q6 33 9 32L17 30L25 21Q26.5 19 29 19H41Q43.5 19 45 21L50 29L55 31Q58 32 58 35V42Q58 44 56 44H52"/>
                <path pathLength="1" d="M22 44H42"/>
                <path pathLength="1" d="M20 30L27 22H34V30Z"/>
                <path pathLength="1" d="M38 22H41L46 30H38Z"/>
                <circle pathLength="1" cx="17" cy="44" r="5"/>
                <circle pathLength="1" cx="47" cy="44" r="5"/>
                <circle pathLength="1" cx="51" cy="10" r="6"/>
                <path pathLength="1" d="M45 10H57M51 4C47 8 47 12 51 16M51 4C55 8 55 12 51 16"/>
              </svg>
            </span>
            <span class="cat-t" data-i18n="cat_import_t"></span>
            <span class="cat-d" data-i18n="cat_import_d"></span>
            <span class="cat-cta"><span data-i18n="cat_cta"></span><svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
          </button>

          <button class="cat" type="button" data-cat="disabled" style="--i:1">
            <span class="ico" aria-hidden="true">
              <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <circle pathLength="1" cx="27" cy="11" r="4.5"/>
                <path pathLength="1" d="M27 18V36H42L48 50H55"/>
                <path pathLength="1" d="M27 27H40"/>
                <path pathLength="1" d="M15.3 34A14 14 0 1 0 37 53"/>
              </svg>
            </span>
            <span class="cat-t" data-i18n="cat_disabled_t"></span>
            <span class="cat-d" data-i18n="cat_disabled_d"></span>
            <span class="cat-cta"><span data-i18n="cat_cta"></span><svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
          </button>

          <button class="cat" type="button" data-cat="trucks" style="--i:2">
            <span class="ico" aria-hidden="true">
              <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <path pathLength="1" d="M4 16H36V42H4Z"/>
                <path pathLength="1" d="M36 25H47L59 34V42H36"/>
                <path pathLength="1" d="M42 29H46L53 35H42Z"/>
                <circle pathLength="1" cx="15" cy="45" r="5"/>
                <circle pathLength="1" cx="47" cy="45" r="5"/>
                <path pathLength="1" d="M12 8H28"/>
              </svg>
            </span>
            <span class="cat-t" data-i18n="cat_trucks_t"></span>
            <span class="cat-d" data-i18n="cat_trucks_d"></span>
            <span class="cat-cta"><span data-i18n="cat_cta"></span><svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
          </button>

          <a class="cat cat-cars" href="cars.html" style="--i:3">
            <span class="ico" aria-hidden="true">
              <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <path pathLength="1" d="M5 27L32 8L59 27"/>
                <path pathLength="1" d="M10 24V56H54V24"/>
                <path pathLength="1" d="M18 56V38H46V56"/>
                <path pathLength="1" d="M18 44H46M18 50H46"/>
                <circle pathLength="1" cx="32" cy="24" r="3"/>
              </svg>
            </span>
            <span class="cat-t" data-i18n="cat_cars_t"></span>
            <span class="cat-d" data-i18n="cat_cars_d"></span>
            <span class="cat-cta"><span data-i18n="cat_cars_cta"></span><svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
          </a>
        </div>
      </div>
    </section>

    <!-- LATEST CARS (filled from the API; hidden when there are none) -->
    <section class="latest" id="latest" hidden>
      <div class="wrap">
        <div class="sec-head row reveal">
          <div>
            <span class="kicker" data-i18n="latest_kicker"></span>
            <h2 data-i18n="latest_title"></h2>
          </div>
          <a class="btn ghost sm" href="cars.html"><span data-i18n="latest_all"></span></a>
        </div>
        <div class="car-grid" id="latestGrid"></div>
      </div>
    </section>

    <!-- HOW IT WORKS -->
    <section class="how" id="how">
      <div class="wrap">
        <div class="sec-head reveal">
          <span class="kicker" data-i18n="how_kicker"></span>
          <h2 data-i18n="how_title"></h2>
        </div>
        <div class="steps">
          <article class="step reveal" style="--d:0s"><b class="num">01</b><h3 data-i18n="step1_t"></h3><p data-i18n="step1_d"></p></article>
          <article class="step reveal" style="--d:.12s"><b class="num">02</b><h3 data-i18n="step2_t"></h3><p data-i18n="step2_d"></p></article>
          <article class="step reveal" style="--d:.24s"><b class="num">03</b><h3 data-i18n="step3_t"></h3><p data-i18n="step3_d"></p></article>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="foot">
    <div class="wrap foot-in">
      <div>
        <img class="foot-logo" src="img/logo-full.png" alt="MOAMENOON" width="640" height="366" loading="lazy">
        <p class="foot-text" data-i18n="foot_text"></p>
        <nav class="foot-links" aria-label="links">
          <a href="cars.html" data-i18n="nav_cars"></a>
          <a href="auth.html" data-i18n="nav_login"></a>
          <a href="auth.html?mode=signup" data-i18n="nav_signup"></a>
        </nav>
      </div>
      <div class="foot-contact">
        <span class="kicker" data-i18n="foot_call"></span>
        <a class="phone" id="footTel" href="#" dir="ltr">01050505982</a>
        <a class="btn" id="footWa" href="#" target="_blank" rel="noopener">
          <svg class="wa-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5a9.5 9.5 0 0 0-8.2 14.3L2.5 21.5l4.8-1.3A9.5 9.5 0 1 0 12 2.5z"/><path d="M8.6 8.4c.3 2.5 3.3 5.5 6 5.9l1.4-1.4-2.1-1-1 .8c-.9-.4-1.9-1.4-2.3-2.3l.8-1-1-2.1z"/></svg>
          <span data-i18n="foot_wa"></span>
        </a>
        <div class="socials-wrap">
          <span class="kicker" data-i18n="foot_follow"></span>
          <div class="socials">
            <a id="socFb" href="#" target="_blank" rel="noopener noreferrer" aria-label="Facebook" title="Facebook">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 22v-8.2h2.8l.5-3.4h-3.3V8.3c0-1 .3-1.7 1.7-1.7h1.7V3.6c-.3 0-1.300-.1-2.500-.1-2.500 0-4.200 1.500-4.200 4.300v2.600H7.200v3.400H10V22h3.500z"/></svg>
            </a>
            <a id="socIg" href="#" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
            </a>
          </div>
        </div>
      </div>
    </div>
    <div class="copy">© <span id="year"></span> <span data-i18n="brand"></span> · <span data-i18n="rights"></span></div>
  </footer>

  <!-- floating whatsapp -->
  <a class="fab" id="fab" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5a9.5 9.5 0 0 0-8.2 14.3L2.5 21.5l4.8-1.3A9.5 9.5 0 1 0 12 2.5z"/><path d="M8.6 8.4c.3 2.5 3.3 5.5 6 5.9l1.4-1.4-2.1-1-1 .8c-.9-.4-1.9-1.4-2.3-2.3l.8-1-1-2.1z"/></svg>
  </a>

  <!-- REQUEST MODAL -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-bg" data-close></div>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <div class="panel-head">
        <span class="p-ico" id="mIcon" aria-hidden="true"></span>
        <div class="p-titles">
          <h2 id="mTitle"></h2>
          <p id="mSub" data-i18n="form_sub"></p>
        </div>
        <button class="x" type="button" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="progress" aria-hidden="true"><i id="prog"></i></div>

      <form id="form" class="panel-form" novalidate>
        <div class="panel-body">
          <div class="fields" id="fields"></div>
          <p class="hint" data-i18n="req_hint"></p>
        </div>
        <div class="panel-foot">
          <p class="form-err" id="formErr" role="alert" hidden></p>
          <button class="btn ghost" type="button" data-close data-i18n="cancel"></button>
          <button class="btn" type="submit">
            <svg class="wa-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5a9.5 9.5 0 0 0-8.2 14.3L2.5 21.5l4.8-1.3A9.5 9.5 0 1 0 12 2.5z"/><path d="M8.6 8.4c.3 2.5 3.3 5.5 6 5.9l1.4-1.4-2.1-1-1 .8c-.9-.4-1.9-1.4-2.3-2.3l.8-1-1-2.1z"/></svg>
            <span data-i18n="submit"></span>
          </button>
        </div>
      </form>

      <div class="success" id="success" hidden>
        <div class="panel-body center">
          <svg class="check" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle pathLength="1" cx="40" cy="40" r="34"/><path pathLength="1" d="M25 41l10 10 20-22"/></svg>
          <h2 data-i18n="ok_title"></h2>
          <p class="ok-text" data-i18n="ok_text"></p>
          <div class="summary">
            <h3 data-i18n="ok_summary"></h3>
            <dl id="summary"></dl>
          </div>
        </div>
        <div class="panel-foot">
          <button class="btn ghost" type="button" id="newReq" data-i18n="new_req"></button>
          <a class="btn" id="reopenWa" href="#" target="_blank" rel="noopener">
            <svg class="wa-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5a9.5 9.5 0 0 0-8.2 14.3L2.5 21.5l4.8-1.3A9.5 9.5 0 1 0 12 2.5z"/><path d="M8.6 8.4c.3 2.5 3.3 5.5 6 5.9l1.4-1.4-2.1-1-1 .8c-.9-.4-1.9-1.4-2.3-2.3l.8-1-1-2.1z"/></svg>
            <span data-i18n="open_wa"></span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>

</body>
