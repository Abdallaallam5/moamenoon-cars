<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login | Moamenoon Cars</title>

<link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<link rel="stylesheet" href="../assets/css/variables.css" />
<link rel="stylesheet" href="../assets/css/main.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/responsive.css" />
</head>
<body class="page-auth">

<div class="auth-layout">
  <div class="auth-visual">
    <img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1400&auto=format&fit=crop" alt="" />
    <div class="auth-visual__overlay"></div>
    <a href="index.html" class="navbar__logo auth-visual__logo">
      <span class="navbar__logo-mark">M</span>
      <span class="navbar__logo-text">MOAMENOON <em>CARS</em></span>
    </a>
    <div class="auth-visual__quote">
      <p data-i18n="auth.quote">"The smartest way to buy and sell vehicles in Egypt."</p>
    </div>
  </div>

  <div class="auth-form-panel">
    <button class="lang-switch lang-switch--auth" id="langSwitch" aria-label="Switch language">
      <i class="fa-solid fa-globe"></i><span id="langSwitchLabel">العربية</span>
    </button>

    <div class="auth-form-wrapper">
      <h1 data-i18n="auth.loginTitle">Welcome Back</h1>
      <p class="auth-subtitle" data-i18n="auth.loginSubtitle">Log in to manage your listings and favorites.</p>

      <div class="alert alert--error" id="loginError" style="display:none;"></div>

      <form id="loginForm" class="auth-form">
        <div class="form-field">
          <label for="loginEmail" data-i18n="auth.email">Email Address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required />
        </div>
        <div class="form-field">
          <label for="loginPassword" data-i18n="auth.password">Password</label>
          <div class="input-with-icon">
            <input type="password" id="loginPassword" placeholder="••••••••" required />
            <button type="button" class="input-icon-btn" id="toggleLoginPassword" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="auth-form__row">
          <label class="checkbox">
            <input type="checkbox" id="rememberMe" />
            <span data-i18n="auth.rememberMe">Remember me</span>
          </label>
          <a href="#" class="link-muted" data-i18n="auth.forgotPassword">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn--primary btn--full" id="loginSubmitBtn">
          <span data-i18n="auth.loginButton">Log In</span>
        </button>
      </form>

      <p class="auth-switch">
        <span data-i18n="auth.noAccount">Don't have an account?</span>
        <a href="register.html" data-i18n="auth.registerLink">Sign up</a>
      </p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/i18next/23.11.5/i18next.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/i18next-http-backend/2.5.2/i18nextHttpBackend.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/i18next-browser-languagedetector/8.0.0/i18nextBrowserLanguageDetector.min.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
</body>
</html>
