<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile | Moamenoon Cars</title>

<link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<link rel="stylesheet" href="../assets/css/variables.css" />
<link rel="stylesheet" href="../assets/css/main.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/responsive.css" />
</head>
<body class="page-profile">

<header class="navbar" id="navbar">
  <div class="container navbar__inner">
    <a href="index.html" class="navbar__logo">
      <span class="navbar__logo-mark">M</span>
      <span class="navbar__logo-text">MOAMENOON <em>CARS</em></span>
    </a>
    <nav class="navbar__nav" id="navbarNav">
      <a href="index.html" class="navbar__link" data-i18n="nav.home">Home</a>
      <a href="cars.html" class="navbar__link" data-i18n="nav.cars">Cars</a>
      <a href="motorcycles.html" class="navbar__link" data-i18n="nav.motorcycles">Motorcycles</a>
      <a href="trucks.html" class="navbar__link" data-i18n="nav.trucks">Trucks</a>
      <a href="about.html" class="navbar__link" data-i18n="nav.about">About</a>
      <a href="contact.html" class="navbar__link" data-i18n="nav.contact">Contact</a>
    </nav>
    <div class="navbar__actions">
      <button class="lang-switch" id="langSwitch" aria-label="Switch language"><i class="fa-solid fa-globe"></i><span id="langSwitchLabel">العربية</span></button>
      <a href="favorites.html" class="navbar__icon-btn" aria-label="Favorites"><i class="fa-regular fa-heart"></i></a>
      <button class="btn btn--ghost btn--sm" id="logoutBtn" data-i18n="profile.logout">Log Out</button>
    </div>
    <button class="navbar__burger" id="navbarBurger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </div>
</header>

<section class="page-header">
  <div class="page-header__stripe"></div>
  <div class="container">
    <nav class="breadcrumb"><a href="index.html" data-i18n="nav.home">Home</a> <i class="fa-solid fa-chevron-right"></i> <span data-i18n="profile.title">My Profile</span></nav>
    <h1 data-i18n="profile.title">My Profile</h1>
  </div>
</section>

<section class="section profile-section">
  <div class="container profile-layout">

    <!-- SIDEBAR -->
    <aside class="profile-sidebar">
      <div class="profile-sidebar__card">
        <img id="profileAvatar" src="https://ui-avatars.com/api/?name=User&background=C1121F&color=fff" alt="Avatar" />
        <h3 id="profileName">--</h3>
        <span id="profileEmail" class="text-muted">--</span>
        <span class="badge badge--role" id="profileRole">user</span>
      </div>
      <nav class="profile-sidebar__nav">
        <button class="profile-nav-btn is-active" data-target="tab-info"><i class="fa-solid fa-user"></i> <span data-i18n="profile.personalInfo">Personal Info</span></button>
        <button class="profile-nav-btn" data-target="tab-listings"><i class="fa-solid fa-car"></i> <span data-i18n="profile.myListings">My Listings</span></button>
        <button class="profile-nav-btn" data-target="tab-messages"><i class="fa-solid fa-envelope"></i> <span data-i18n="profile.messages">Messages</span></button>
        <button class="profile-nav-btn" data-target="tab-password"><i class="fa-solid fa-lock"></i> <span data-i18n="profile.security">Security</span></button>
      </nav>
    </aside>

    <!-- CONTENT -->
    <div class="profile-content">

      <!-- PERSONAL INFO TAB -->
      <div class="profile-tab is-active" id="tab-info">
        <h2 data-i18n="profile.personalInfo">Personal Info</h2>
        <form id="profileInfoForm" class="profile-form">
          <div class="form-row">
            <div class="form-field">
              <label for="profileNameInput" data-i18n="auth.fullName">Full Name</label>
              <input type="text" id="profileNameInput" />
            </div>
            <div class="form-field">
              <label for="profilePhoneInput" data-i18n="auth.phone">Phone</label>
              <input type="tel" id="profilePhoneInput" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label for="profileCityInput" data-i18n="filters.location">City</label>
              <input type="text" id="profileCityInput" />
            </div>
            <div class="form-field">
              <label for="profileCountryInput" data-i18n="profile.country">Country</label>
              <input type="text" id="profileCountryInput" />
            </div>
          </div>
          <button type="submit" class="btn btn--primary" data-i18n="profile.saveChanges">Save Changes</button>
        </form>
      </div>

      <!-- MY LISTINGS TAB -->
      <div class="profile-tab" id="tab-listings">
        <div class="profile-tab__header">
          <h2 data-i18n="profile.myListings">My Listings</h2>
          <a href="dashboard.html" class="btn btn--primary btn--sm"><i class="fa-solid fa-plus"></i> <span data-i18n="profile.addListing">Add Listing</span></a>
        </div>
        <div class="my-listings-table" id="myListingsTable">
          <!-- rows injected by JS -->
        </div>
      </div>

      <!-- MESSAGES TAB -->
      <div class="profile-tab" id="tab-messages">
        <h2 data-i18n="profile.messages">Messages</h2>
        <div class="messages-list" id="messagesList">
          <!-- injected by JS -->
        </div>
      </div>

      <!-- SECURITY TAB -->
      <div class="profile-tab" id="tab-password">
        <h2 data-i18n="profile.security">Security</h2>
        <form id="passwordForm" class="profile-form">
          <div class="form-field">
            <label for="currentPasswordInput" data-i18n="profile.currentPassword">Current Password</label>
            <input type="password" id="currentPasswordInput" required />
          </div>
          <div class="form-field">
            <label for="newPasswordInput" data-i18n="profile.newPassword">New Password</label>
            <input type="password" id="newPasswordInput" minlength="6" required />
          </div>
          <button type="submit" class="btn btn--primary" data-i18n="profile.updatePassword">Update Password</button>
        </form>
      </div>

    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/i18next/23.11.5/i18next.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/i18next-http-backend/2.5.2/i18nextHttpBackend.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/i18next-browser-languagedetector/8.0.0/i18nextBrowserLanguageDetector.min.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/main.js"></script>
</body>
</html>
