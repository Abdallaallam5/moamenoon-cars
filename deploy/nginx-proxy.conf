# /etc/nginx/snippets/moamenoon-proxy.conf  (setup-server.sh installs it)
proxy_pass http://moam_app;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# the app reads the visitor's real IP from this header (TRUST_PROXY in .env must match how many proxies are in front)
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 90s;
proxy_send_timeout 90s;
proxy_request_buffering on;
