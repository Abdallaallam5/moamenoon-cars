# nginx site for Moamenoon Cars  ->  /etc/nginx/sites-available/moamenoon  (setup-server.sh installs it for you)
#
# nginx serves the car PHOTOS itself (much cheaper than Node) and passes everything else to the app.
# Replace YOUR-DOMAIN.com, and check the two paths below match where you put the app (APP_DIR in setup-server.sh).

# per-visitor request limits (a second safety net on top of the app's own limits)
limit_req_zone $binary_remote_addr zone=moam_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=moam_login:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=moam_conn:10m;

upstream moam_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR-DOMAIN.com www.YOUR-DOMAIN.com;

    # 8 photos x 6 MB is the app's own limit
    client_max_body_size 50m;
    client_body_timeout 60s;
    limit_conn moam_conn 60;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    # Car photos: named with random hashes and never edited, so they can be cached for a very long time.
    location /uploads/ {
        alias /var/www/moamenoon/data/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
        access_log off;
        try_files $uri =404;
    }

    location = /api/health {
        access_log off;
        proxy_pass http://moam_app;
    }

    location /api/auth/ {
        limit_req zone=moam_login burst=20 nodelay;
        include /etc/nginx/snippets/moamenoon-proxy.conf;
    }

    location /api/ {
        limit_req zone=moam_api burst=80 nodelay;
        include /etc/nginx/snippets/moamenoon-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/moamenoon-proxy.conf;
    }
}
